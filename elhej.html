 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرعة الحج</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e8f5e9, #fff8e1);
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    h1 {
        color: #176b3a;
        margin-bottom: 5px;
    }

    .subtitle {
        color: #555;
        margin-bottom: 20px;
    }

    .box {
        background: white;
        max-width: 900px;
        margin: auto;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 15px #0002;
    }

    input {
        padding: 10px;
        margin: 5px;
        border: 1px solid #aaa;
        border-radius: 8px;
        font-size: 16px;
    }

    button {
        padding: 11px 20px;
        margin: 7px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        background: #1976d2;
        color: white;
    }

    button:hover {
        opacity: 0.85;
    }

    .add {
        background: #388e3c;
    }

    .draw {
        background: #d84315;
        font-size: 20px;
        padding: 15px 35px;
    }

    .reset {
        background: #555;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid #ddd;
        padding: 10px;
    }

    th {
        background: #176b3a;
        color: white;
    }

    .tickets {
        color: #d84315;
        font-weight: bold;
    }

    .winner {
        margin-top: 25px;
        padding: 20px;
        background: #fff3cd;
        border: 3px solid #ffc107;
        border-radius: 15px;
        font-size: 25px;
        font-weight: bold;
        color: #8a5a00;
        min-height: 35px;
    }

    .results {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
    }

    .result {
        background: #e8f5e9;
        border: 2px solid #4caf50;
        border-radius: 10px;
        padding: 12px 20px;
        font-weight: bold;
    }

    .counter {
        margin: 15px;
        font-size: 18px;
    }
</style>
</head>

<body>

<div class="box">

    <h1>🎟️ قرعة الحج</h1>
    <div class="subtitle">
        القرعة حسب أقدمية التسجيل
    </div>

    <h3>إضافة المسجلين</h3>

    <input type="text" id="nameInput" placeholder="اسم الشخص">

    <input
        type="number"
        id="yearsInput"
        placeholder="سنوات التسجيل"
        min="1"
        value="1"
    >

    <button class="add" onclick="addPerson()">
        ➕ إضافة
    </button>

    <br>

    <label>
        عدد الفائزين:
        <input
            type="number"
            id="winnerCount"
            min="1"
            value="3"
            style="width:70px"
        >
    </label>

    <div class="counter">
        عدد المسجلين:
        <strong id="peopleCount">0</strong>
        |
        مجموع الأوراق:
        <strong id="ticketCount">0</strong>
    </div>

    <table>
        <thead>
            <tr>
                <th>رقم</th>
                <th>اسم المسجل</th>
                <th>سنوات التسجيل</th>
                <th>عدد الأوراق</th>
            </tr>
        </thead>

        <tbody id="peopleTable">
        </tbody>
    </table>

    <br>

    <button class="draw" onclick="drawWinner()">
        🎲 إجراء القرعة
    </button>

    <button class="reset" onclick="resetLottery()">
        🔄 إعادة القرعة
    </button>

    <div class="winner" id="currentWinner">
        في انتظار القرعة...
    </div>

    <h3>🏆 الفائزون</h3>

    <div class="results" id="results">
    </div>

</div>

<script>

let people = [];

// إضافة شخص
function addPerson() {

    let name = document.getElementById("nameInput").value.trim();
    let years = parseInt(document.getElementById("yearsInput").value);

    if (name === "") {
        alert("أدخل اسم الشخص");
        return;
    }

    if (isNaN(years) || years < 1) {
        alert("أدخل عدد سنوات صحيح");
        return;
    }

    people.push({
        name: name,
        years: years
    });

    document.getElementById("nameInput").value = "";
    document.getElementById("yearsInput").value = "1";

    updateTable();
}


// تحديث الجدول
function updateTable() {

    let table = document.getElementById("peopleTable");

    table.innerHTML = "";

    let totalTickets = 0;

    people.forEach(function(person, index) {

        totalTickets += person.years;

        let row = document.createElement("tr");

        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${person.name}</td>
            <td>${person.years}</td>
            <td class="tickets">${person.years}</td>
        `;

        table.appendChild(row);
    });

    document.getElementById("peopleCount").textContent =
        people.length;

    document.getElementById("ticketCount").textContent =
        totalTickets;
}


// إنشاء صندوق القرعة
function createTickets() {

    let tickets = [];

    people.forEach(function(person) {

        for (let i = 0; i < person.years; i++) {

            tickets.push(person);

        }

    });

    return tickets;
}


// إجراء القرعة
function drawWinner() {

    let winnerNumber =
        parseInt(document.getElementById("winnerCount").value);

    if (people.length === 0) {
        alert("أضف المسجلين أولاً");
        return;
    }

    if (winnerNumber < 1) {
        alert("حدد عدد الفائزين");
        return;
    }

    if (winnerNumber > people.length) {
        alert("عدد الفائزين أكبر من عدد المسجلين");
        return;
    }

    // إذا وصلنا إلى عدد الفائزين المطلوب
    let currentResults =
        document.querySelectorAll(".result").length;

    if (currentResults >= winnerNumber) {
        alert("تم الوصول إلى عدد الفائزين المحدد");
        return;
    }

    // إنشاء الأوراق الحالية
    let tickets = createTickets();

    if (tickets.length === 0) {
        alert("لا توجد أوراق متبقية");
        return;
    }

    // اختيار ورقة عشوائية
    let randomIndex =
        Math.floor(Math.random() * tickets.length);

    let selectedPerson =
        tickets[randomIndex];

    // عرض حركة السحب
    let winnerBox =
        document.getElementById("currentWinner");

    winnerBox.textContent = "🎲 جاري السحب...";

    setTimeout(function() {

        winnerBox.textContent =
            "🏆 الفائز: " + selectedPerson.name;

        // إضافة الفائز إلى النتائج
        let result =
            document.createElement("div");

        result.className = "result";

        result.textContent =
            "🏆 " +
            (currentResults + 1) +
            " - " +
            selectedPerson.name;

        document.getElementById("results")
            .appendChild(result);


        /*
          الأهم هنا:

          نحذف الشخص الفائز كلياً
          وليس ورقة واحدة فقط.
        */

        people = people.filter(function(person) {

            return person.name !== selectedPerson.name;

        });

        updateTable();

    }, 1200);
}


// إعادة القرعة من البداية
function resetLottery() {

    if (!confirm("هل تريد إعادة القرعة من البداية؟")) {
        return;
    }

    // إعادة تحميل الصفحة
    location.reload();
}

</script>

</body>
</html>

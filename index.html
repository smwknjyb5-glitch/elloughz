 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألغاز رياضية ومنطقية</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b1630;--card:#13224a;--tx:#f3efe0;--mut:#9fb0d6;--gold:#e9c46a;--ok:#5fd38d;--bad:#ff7b7b;--line:#2a3d73}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f2e6;--card:#fff;--tx:#1b2440;--mut:#5a6486;--gold:#a8771a;--ok:#1f8a4c;--bad:#c0392b;--line:#d9d2bb}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.8}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{text-align:center;color:var(--gold);margin:8px 0 4px;font-size:1.6rem}
.sub{text-align:center;color:var(--mut);margin:0 0 14px}
.score{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;z-index:5;margin-bottom:14px}
.bar{flex:1;height:8px;background:var(--line);border-radius:6px;margin:0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.tag{font-size:.8rem;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:0 10px;margin-inline-start:6px}
.q{font-size:1.05rem;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input{flex:1;min-width:120px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 14px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold);font:inherit;cursor:pointer}
button.main{background:var(--gold);color:#1b2440;font-weight:700}
.msg{margin-top:8px;min-height:1.6em}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.box{display:none;margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);border-inline-start:4px solid var(--gold);color:var(--tx)}
.box.show{display:block;animation:f .35s}
@keyframes f{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.hint{color:var(--mut)}
.done{border-color:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>🧩 ألغاز رياضية ومنطقية</h1>
<p class="sub">فكّر أولًا، ثم اكتب إجابتك، واستعن بالتلميح عند الحاجة</p>
<div class="score"><span id="sc">0 / 0</span><div class="bar"><i id="pb"></i></div><button id="rs">إعادة</button></div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
</div>
<script>
var P=[
{t:"رياضي",q:"ما العدد التالي في المتتالية: 2 ، 6 ، 12 ، 20 ، 30 ، ؟",a:[42],h:"انظر إلى الفروق بين الأعداد المتتالية: 4، 6، 8، 10 …",s:"الفروق تزداد بمقدار 2: ‏4، 6، 8، 10، فالفرق التالي 12، إذن 30 + 12 = 42. (والقاعدة: ن × (ن + 1))."},
{t:"رياضي",q:"عمر الأب ضعف عمر ابنه، ومجموع عمريهما 36 سنة. كم عمر الابن؟",a:[12],h:"إذا كان عمر الابن س فعمر الأب 2س.",s:"س + 2س = 36 ⇒ 3س = 36 ⇒ س = 12. الابن 12 سنة والأب 24 سنة."},
{t:"منطقي",q:"تتضاعف مساحة الزنبق على سطح بركة كل يوم، وتغطي البركة كاملة بعد 48 يومًا. في أي يوم كانت تغطي نصف البركة؟",a:[47],h:"ماذا يحدث لمساحة الزنبق في اليوم التالي؟",s:"بما أن المساحة تتضاعف يوميًا، فنصف البركة يتضاعف إلى البركة كاملة في اليوم التالي، أي كانت نصفها في اليوم 47."},
{t:"رياضي",q:"مضرب وكرة ثمنهما معًا 1.10 دينار، والمضرب أغلى من الكرة بدينار واحد. كم ثمن الكرة بالدينار؟",a:[0.05],h:"الجواب ليس 0.10 كما يتبادر إلى الذهن.",s:"إذا كانت الكرة س فالمضرب س + 1، ومنه 2س + 1 = 1.10 ⇒ س = 0.05 دينار (5 سنتيمات)."},
{t:"رياضي",q:"إذا صنعت 5 آلات 5 قطع في 5 دقائق، فكم دقيقة تحتاج 100 آلة لصنع 100 قطعة؟",a:[5],h:"كم دقيقة تحتاج آلة واحدة لصنع قطعة واحدة؟",s:"كل آلة تصنع قطعة في 5 دقائق. فـ 100 آلة تصنع 100 قطعة في 5 دقائق أيضًا."},
{t:"رياضي",q:"في حفل 6 أشخاص صافح كل واحد منهم كل الآخرين مرة واحدة فقط. كم عدد المصافحات الكلي؟",a:[15],h:"كل شخص يصافح 5 أشخاص، لكن المصافحة الواحدة تُحتسب مرتين.",s:"(6 × 5) ÷ 2 = 15 مصافحة. وهي أيضًا 5 + 4 + 3 + 2 + 1 = 15."},
{t:"رياضي",q:"احسب مجموع الأعداد من 1 إلى 100.",a:[5050],h:"جمع الأول مع الأخير: 1 + 100، ثم الثاني مع ما قبل الأخير …",s:"نكوّن 50 زوجًا مجموع كل زوج 101، فالمجموع 50 × 101 = 5050."},
{t:"رياضي",q:"كم مرة يظهر الرقم 9 عند كتابة الأعداد من 1 إلى 100؟",a:[20],h:"عُدّ خانة الآحاد وخانة العشرات كلًا على حدة.",s:"في خانة الآحاد: 9، 19، … ، 99 أي 10 مرات. وفي خانة العشرات: 90 إلى 99 أي 10 مرات. المجموع 20."},
{t:"رياضي",q:"ما العدد غير الصفري الذي يكون ناتج جمعه مع نفسه مساويًا لناتج ضربه في نفسه؟",a:[2],h:"اكتب المعادلة: س + س = س × س.",s:"2س = س² ⇒ س² − 2س = 0 ⇒ س(س − 2) = 0، وبما أن س ≠ 0 فإن س = 2. تحقّق: 2 + 2 = 4 و 2 × 2 = 4."},
{t:"منطقي",q:"أمامك بابان، خلف أحدهما كنز والآخر فخ. عند كل باب حارس: أحدهما يقول الصدق دائمًا والآخر يكذب دائمًا، ولا تعرف أيهما. يمكنك طرح سؤال واحد لحارس واحد. ماذا تسأل؟",a:null,h:"اجعل السؤال يتناول ما سيقوله الحارس الآخر.",s:"اسأل أي حارس: «ماذا سيقول لي الحارس الآخر إذا سألته: أي باب فيه الكنز؟». الصادق سينقل كذب الكاذب، والكاذب سيكذب في نقل صدق الصادق، فالجواب في الحالتين هو الباب الخاطئ. فاختر الباب الآخر."},
{t:"منطقي",q:"معك فتيلان، يحترق كل منهما في ساعة كاملة، لكن الاحتراق غير منتظم السرعة. كيف تقيس 45 دقيقة بالضبط؟",a:null,h:"أشعل أحد الفتيلين من طرفيه معًا.",s:"أشعل الفتيل الأول من طرفيه والثاني من طرف واحد في اللحظة نفسها. يحترق الأول كاملًا بعد 30 دقيقة، وعندها أشعل الطرف الآخر للفتيل الثاني، فيحترق ما تبقى (نصف ساعة من طرف واحد) في 15 دقيقة. المجموع 45 دقيقة."},
{t:"منطقي",q:"ثلاثة مصابيح في غرفة مغلقة، وثلاثة مفاتيح خارجها، ويمكنك دخول الغرفة مرة واحدة فقط. كيف تعرف أي مفتاح يشغّل أي مصباح؟",a:null,h:"للمصباح حالتان تُلاحظان: مضاء/مطفأ، وكذلك ساخن/بارد.",s:"شغّل المفتاح الأول عدة دقائق ثم أطفئه، وشغّل المفتاح الثاني واتركه مضاءً، واترك الثالث مطفأً، ثم ادخل. المصباح المضاء للمفتاح الثاني، والدافئ المطفأ للأول، والبارد المطفأ للثالث."}
,
{l:1,t:"رياضي",q:"ما العدد التالي في المتتالية: 3 ، 6 ، 9 ، 12 ، ؟",a:[15],h:"الفرق بين كل عددين متتاليين ثابت.",s:"نضيف 3 في كل مرة، فالعدد التالي 12 + 3 = 15."},
{l:1,t:"رياضي",q:"نصف عدد يساوي 15. ما هذا العدد؟",a:[30],h:"الضعف عكس النصف.",s:"العدد = 15 × 2 = 30."},
{l:3,t:"رياضي",q:"كم مربعًا (بكل الأحجام) توجد في شبكة مربعات أبعادها 4 × 4؟",a:[30],h:"لا تعدّ المربعات الصغيرة فقط، بل المربعات 2×2 و3×3 و4×4 أيضًا.",s:"مربعات 1×1: ‏16، ومربعات 2×2: ‏9، ومربعات 3×3: ‏4، ومربع 4×4: ‏1. المجموع 16 + 9 + 4 + 1 = 30."},
{l:3,t:"منطقي",q:"أربعة أشخاص يريدون عبور جسر ليلًا بمصباح واحد، ولا يعبر إلا اثنان معًا كحد أقصى، ويسيران بسرعة الأبطأ. يحتاجون على الترتيب إلى 1 و2 و5 و10 دقائق. ما أقل زمن (بالدقائق) لعبورهم جميعًا؟",a:[17],h:"أرسل الشخصين الأبطأ معًا، ولا تجعل الأسرع يرافق كل مرة.",s:"يعبر 1 و2 (دقيقتان)، ويعود 1 (دقيقة)، ثم يعبر 5 و10 معًا (10 دقائق)، ويعود 2 (دقيقتان)، ثم يعبر 1 و2 (دقيقتان). المجموع 2 + 1 + 10 + 2 + 2 = 17 دقيقة."}
];
var st={};
var LV=[1,1,2,2,2,2,3,2,1,3,3,2],cur=0,cnt=0,LN={1:"سهل",2:"متوسط",3:"صعب"};
P.forEach(function(p,i){if(!p.l)p.l=LV[i]});
var L=document.getElementById("list");
function norm(s){
  var m={"٠":0,"١":1,"٢":2,"٣":3,"٤":4,"٥":5,"٦":6,"٧":7,"٨":8,"٩":9};
  return String(s).replace(/[٠-٩]/g,function(c){return m[c]}).replace(/[،,]/g,".").replace(/[\u064B-\u0652ـ]/g,"").replace(/\s+/g," ").trim();
}
function build(){
  L.innerHTML="";cnt=0;
  P.forEach(function(p,i){
    if(cur&&p.l!==cur)return;
    var c=document.createElement("div");c.className="card";c.id="c"+i;
    var ans=p.a?'<div class="row"><input id="i'+i+'" inputmode="text" placeholder="اكتب إجابتك"><button class="main" data-k="chk" data-i="'+i+'">تحقّق</button></div>':"";
    c.innerHTML='<b>اللغز '+(++cnt)+'</b><span class="tag">'+p.t+'</span><span class="tag">'+LN[p.l]+'</span><div class="q">'+p.q+'</div>'+ans+
      '<div class="msg" id="m'+i+'"></div>'+
      '<div class="row"><button data-k="hint" data-i="'+i+'">💡 تلميح</button><button data-k="sol" data-i="'+i+'">الحل</button></div>'+
      '<div class="box hint" id="h'+i+'">'+p.h+'</div><div class="box" id="s'+i+'">'+p.s+'</div>';
    L.appendChild(c);if(st[i]){c.classList.add("done");document.getElementById("s"+i).classList.add("show");var mm=document.getElementById("m"+i);mm.className="msg ok";mm.textContent="✅ تم حلّه.";}
  });
  upd();
}
function upd(){
  var n=0,tot=0;P.forEach(function(p,i){if(p.a&&(!cur||p.l===cur)){tot++;if(st[i])n++}});
  document.getElementById("sc").textContent=n+" / "+tot;
  document.getElementById("pb").style.width=(tot?n/tot*100:0)+"%";
}
function check(i){
  var p=P[i],v=norm(document.getElementById("i"+i).value),m=document.getElementById("m"+i),ok=false;
  if(!v){m.className="msg bad";m.textContent="اكتب إجابة أولًا.";return}
  if(typeof p.a[0]==="number"){var x=parseFloat(v);ok=!isNaN(x)&&Math.abs(x-p.a[0])<1e-9}
  else ok=p.a.some(function(a){return v.indexOf(a)>-1});
  if(ok){m.className="msg ok";m.textContent="✅ أحسنت! إجابة صحيحة.";st[i]=1;document.getElementById("c"+i).classList.add("done");document.getElementById("s"+i).classList.add("show");upd()}
  else{m.className="msg bad";m.textContent="❌ ليست صحيحة، جرّب مرة أخرى أو استعن بالتلميح."}
}
L.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var i=b.getAttribute("data-i"),k=b.getAttribute("data-k");
  if(k==="chk")check(i);
  if(k==="hint")document.getElementById("h"+i).classList.toggle("show");
  if(k==="sol")document.getElementById("s"+i).classList.toggle("show");
});
document.getElementById("rs").onclick=function(){st={};build()};
L.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.tagName==="INPUT")check(e.target.id.slice(1))});
var T=document.getElementById("tabs");
[[0,"الكل"],[1,"سهل"],[2,"متوسط"],[3,"صعب"]].forEach(function(x){var b=document.createElement("button");b.textContent=x[1];b.setAttribute("data-l",x[0]);T.appendChild(b)});
function tabs(){[].forEach.call(T.children,function(b){b.className=(+b.getAttribute("data-l")===cur)?"main":""})}
T.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;cur=+b.getAttribute("data-l");tabs();build()});
tabs();
build();
</script>
</body>
</html>
